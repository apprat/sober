<!DOCTYPE html>
<html lang="ZH-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> {% title %} </title>
  <meta name="viewport"
    content="width=device-width,viewport-fit=cover,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="/styles/scrollbar.css">
  <link rel="stylesheet" href="/styles/table.css">
  <link rel="stylesheet" href="/styles/markdown.css">
  <style>
    :not(:defined) {
      display: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    .page {
      height: 100%;
      overflow: auto;
      margin: 0 auto;
      max-width: 1440px;
      box-shadow: var(--s-elevation-level1);
      user-select: text;
    }

    .preview {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .preview>.view {
      padding: 12px;
      background: var(--s-color-surface-container-lowest);
    }

    .preview>.view>* {
      margin: 4px;
    }

    .preview>.view.block {
      padding: 0;
    }

    .preview>.view.center {
      text-align: center;
    }

    .preview>.view.block>* {
      margin: 0;
    }

    .preview>.view hr {
      margin: 8px 0 !important;
    }

    .preview>details {
      position: relative;
      box-shadow: 0px -1px 0 0 rgba(0, 0, 0, 0.1);
    }

    .preview>details>summary {
      user-select: none;
      border-top: solid 1px var(--s-color-outline-variant);
      border-top: none;
    }

    .preview>details>pre {
      border-radius: 0;
    }
  </style>
  <style>
    .toggle-style {
      position: fixed;
      right: 24px;
      bottom: 96px;
    }

    .toggle-theme {
      position: fixed;
      right: 24px;
      bottom: 24px;
    }
  </style>
  <script type="module">
    import * as components from '/dist/main.js'
    import { Fluent } from '/dist/designs/fluent.js'

    window.sober = {
      components,
      designs: { Fluent }
    }
    const page = document.querySelector('.page')
    window.toggleTheme = (el) => page.toggle(page.hasAttribute('dark') ? 'light' : 'dark', el)
    window.toggleStyle = () => Fluent.toggle(components)
  </script>
</head>

<body>
  <s-page class="page">
    <main>{% content %}</main>
    <s-fab class="toggle-style" onclick="toggleStyle()">
      <s-icon name="add"></s-icon>
      <s-tooltip gravity="left">切换Fluent设计</s-tooltip>
    </s-fab>
    <s-fab class="toggle-theme" onclick="toggleTheme(this)">
      <s-icon name="dark_mode"></s-icon>
      <s-tooltip gravity="left">切换主题</s-tooltip>
    </s-fab>
  </s-page>

</body>

</html>
