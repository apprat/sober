<!DOCTYPE html>
<html lang="ZH-cn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> {% title %} </title>
  <meta name="viewport"
    content="width=device-width,viewport-fit=cover,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="/style/scroll-view.css">
  <link rel="stylesheet" href="/style/table.css">
  <style>
    :not(:defined) {
      display: none;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    .page {
      height: 100%;
      overflow: auto;
      margin: 0 auto;
      padding: 32px;
      max-width: 1440px;
      box-shadow: var(--s-elevation-level1);
      user-select: text;
    }

    .page>* {
      margin: 16px 0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      margin: 0;
      text-transform: capitalize;
    }

    p {
      margin: 0;
      line-height: 2;
    }

    a {
      color: var(--s-color-primary);
    }

    pre {
      white-space: pre-wrap;
      background: var(--s-color-surface-container-high);
      margin: 0;
      padding: 8px;
      border-radius: 4px;
      overflow: auto;
      white-space: revert;
      font-family: monospace;
    }

    pre>code {
      background: none;
      padding: 0;
      font-family: monospace;
      display: block;
      line-height: calc(100% + 6px);
    }

    pre>code .highlighted {
      border-bottom: solid 1px rgba(255, 255, 255, .2);
    }

    details>summary {
      cursor: pointer;
      background: var(--s-color-surface-container-low);
      padding: 8px 12px;
      border-radius: 4px;
    }

    blockquote {
      border-left: 4px solid var(--s-color-on-surface-variant);
      padding-left: 12px;
      margin: 0;
      color: var(--s-color-on-primary-container);
      font-style: italic;
      font-size: 14px;
      background: var(--s-color-primary-container);
      padding: 8px 12px;
      border-radius: 4px;
    }

    hr {
      border: none;
      border-top: solid 1px var(--s-color-surface-variant);
      width: -webkit-fill-available;
    }

    code {
      background: rgba(0, 0, 0, 0.08);
      padding: 3px 5px;
      border-radius: 4px;
      font-family: monospace;
    }

    ol,
    ul {
      padding: 0;
      margin: 0;
      line-height: 2;
    }

    :is(ol, ul)>li {
      margin-left: 20px;
    }

    .preview {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .preview>.view {
      padding: 12px;
      background: var(--s-color-surface-container-lowest);
    }

    .preview>.view>* {
      margin: 4px;
    }

    .preview>.view.block {
      padding: 0;
    }

    .preview>.view.center {
      text-align: center;
    }

    .preview>.view.block>* {
      margin: 0;
    }

    .preview>.view hr {
      margin: 8px 0 !important;
    }

    .preview>details {
      position: relative;
      box-shadow: 0px -1px 0 0 rgba(0, 0, 0, 0.1);
    }

    .preview>details>summary {
      user-select: none;
      border-top: solid 1px var(--s-color-outline-variant);
      border-top: none;
    }

    .preview>details>pre {
      border-radius: 0;
    }
  </style>
  <style>
    .toggle-style {
      position: fixed;
      right: 24px;
      bottom: 96px;
    }

    .toggle-theme {
      position: fixed;
      right: 24px;
      bottom: 24px;
    }
  </style>
  <script type="module">
    import * as components from '/dist/main.js'
    import { material } from '/dist/design/material.js'
    import { fluent } from '/dist/design/fluent.js'

    window.sober = {
      components,
      design: { material, fluent }
    }
    const page = document.querySelector('.page')
    window.toggleTheme = (el) => page.toggle(page.hasAttribute('dark') ? 'light' : 'dark', el)
    let isFluent = false
    window.toggleStyle = () => {
      isFluent ? material(components) : fluent(components)
      isFluent = !isFluent
    }
  </script>
</head>

<body>
  <s-page class="page">
    {% content %}
    <s-floating-action-button class="toggle-style" onclick="toggleStyle()">
      <s-icon name="add"></s-icon>
      <s-tooltip gravity="left">切换Fluent设计</s-tooltip>
    </s-floating-action-button>
    <s-floating-action-button class="toggle-theme" onclick="toggleTheme(this)">
      <s-icon name="dark_mode"></s-icon>
      <s-tooltip gravity="left">切换主题</s-tooltip>
    </s-floating-action-button>
  </s-page>

</body>

</html>
