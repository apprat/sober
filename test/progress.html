<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不确定进度条：left + width 实现</title>

  <style>
    :root {
      --primary: #6750a4;
      --secondary-container: #e8def8;
      --progress-height: 4px;
    }

    body {
      margin: 0;
      padding: 48px 24px;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 20px;
      background: var(--primary);
      color: #fff;
    }

    .aui-linear-progress {
      position: relative;
      width: 100%;
      height: var(--progress-height);
      overflow: hidden;
      color: var(--primary);
    }

    .segment {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      border-radius: 999px;
      visibility: hidden;
      pointer-events: none;
      will-change: left, width;
    }

    .track {
      background: var(--secondary-container);
    }

    .indicator {
      background: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      .segment {
        will-change: auto;
      }
    }
  </style>
</head>

<body>
  <h1>不确定进度条</h1>

  <section
    id="progress"
    class="aui-linear-progress"
    role="progressbar"
    aria-label="加载中"
    aria-busy="true">
    <!-- 第一个紫色指示条前的背景 -->
    <div class="segment track"></div>

    <!-- 后出现的紫色指示条 -->
    <div class="segment indicator"></div>

    <!-- 两个紫色指示条之间的背景 -->
    <div class="segment track"></div>

    <!-- 先出现的紫色指示条 -->
    <div class="segment indicator"></div>

    <!-- 最后的背景 -->
    <div class="segment track"></div>
  </section>

  <script>
    const ANIMATION_DURATION = 1800;
    const GAP_PX = 4;
    const FPS = 60;
    const root = document.getElementById("progress");
    const segments = [...root.querySelectorAll(".segment")];
    function cubicBezier(x1, y1, x2, y2) {
      const sample = (t, p1, p2) => {
        const i = 1 - t;
        return 3 * i * i * t * p1 + 3 * i * t * t * p2 + t ** 3;
      };
      return (value) => {
        let lower = 0, upper = 1, t = value;
        for (let i = 0; i < 14; i++) {
          t = (lower + upper) / 2;
          if (sample(t, x1, x2) < value) lower = t;
          else upper = t;
        }
        return sample(t, y1, y2);
      };
    }
    const animations = [
      [1267, 533, cubicBezier(.2, 0, .8, 1)],
      [1000, 567, cubicBezier(.4, 0, 1, 1)],
      [333, 850, cubicBezier(0, 0, .65, 1)],
      [0, 750, cubicBezier(.1, 0, .45, 1)],
    ];
    function value(elapsed, delay, duration, easing) {
      if (elapsed <= delay) return 0;
      if (elapsed >= delay + duration) return 1;
      return easing((elapsed - delay) / duration);
    }
    function number(value) {
      return +value.toFixed(5);
    }
    function segment(start, end, startGap = 0, endGap = 0) {
      if (end <= start) return "left:0;width:0;visibility:hidden;";
      const left = `calc(${number(start * 100)}% + ${startGap}px)`;
      const width = `max(0px,calc(${number((end - start) * 100)}% - ${startGap + endGap}px))`;
      return `left:${left};width:${width};visibility:visible;`;
    }
    function frame(elapsed) {
      const [lateStart, lateEnd, earlyStart, earlyEnd] = animations.map(
        ([delay, duration, easing]) => value(elapsed, delay, duration, easing)
      );
      return [
        segment(0, lateStart, 0, GAP_PX),
        segment(lateStart, lateEnd),
        segment(lateEnd, earlyStart, lateEnd > 0 ? GAP_PX : 0, earlyStart < 1 ? GAP_PX : 0),
        segment(earlyStart, earlyEnd),
        segment(earlyEnd, 1, earlyEnd > 0 ? GAP_PX : 0),
      ];
    }
    function keyframes() {
      const count = Math.round(ANIMATION_DURATION / 1000 * FPS);
      const rules = segments.map((_, i) => `@keyframes aui-progress-${i}{`);
      for (let i = 0; i <= count; i++) {
        const progress = i / count;
        const percentage = number(progress * 100);
        frame(progress * ANIMATION_DURATION).forEach((style, index) => {
          rules[index] += `${percentage}%{${style}}`;
        });
      }
      return rules.map((rule) => `${rule}}`).join("");
    }
    function insertStyle() {
      const style = document.createElement("style");
      const rules = segments.map((_, i) => `#progress .segment:nth-child(${i + 1}){animation:aui-progress-${i} ${ANIMATION_DURATION}ms linear infinite both;}`).join("");
      style.textContent = keyframes() + rules;
      document.head.append(style);
    }
    insertStyle();
  </script>

</body>

</html>
