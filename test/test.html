<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    .test {
      width: 80px;
      height: 80px;
      background: rgb(17, 89, 104);
      outline: solid 1px #eee;
      animation: test 8s linear infinite;
    }

    @keyframes test {
      0% {
        --clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      }

      50% {
        --clip-path: polygon(0% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      }
    }
  </style>
</head>

<body>
  <svg width="200" height="200" viewBox="0 0 200 200">
    <!-- 组合动画元素 -->
    <path id="combo" fill="green">
      <!-- 路径动画：三角形→圆形 -->
      <animate
        attributeName="d"
        dur="4s"
        values="
            M50,100 L100,50 L150,100 Z;
            M100,100 m-50,0 a50,50 0 1,0 100,0 a50,50 0 1,0 -100,0;
            M50,100 L100,50 L150,100 Z"
        keyTimes="0; 0.5; 1"
        repeatCount="indefinite" />
      <!-- 旋转动画 -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        dur="2s"
        values="0 100 100; 360 100 100"
        keySplines="0.4, 0, 0.2, 1"
        repeatCount="indefinite" />
    </path>
  </svg>
</body>

</html>
