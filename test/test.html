<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px;
      font-size: 18px;
      line-height: calc(100% + 12px);
    }

    .test {
      display: flex;
      flex-wrap: wrap;
      background: #114922;
    }

    .b {
      display: contents;
      background: #841010;

      .ba {
        flex-grow: 1;
      }

      .bb {
        flex-basis: 100%;
        order: 1;
        background: #2d0a4f;
      }
    }

    .c {
      background: #0a4f2d;
    }
  </style>
</head>

<body>

  <div class="test">
    <div class="a">a</div>
    <div class="b">
      <div class="ba">ba</div>
      <div class="bb">bb</div>
    </div>
    <div class="c">c</div>
  </div>
</body>

</html>
