<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px;
      font-size: 18px;
      line-height: calc(100% + 12px);
    }

    .test {
      height: 4px;
      padding: 0 2px;
      background: #eee;

      svg {
        display: block;
        height: 100%;
        overflow: visible;

        line {
          stroke: #009688;
          stroke-width: 4;
          stroke-linecap: round;
        }
      }
    }
  </style>
</head>

<body>

  <div class="test">
    <svg width="100%" height="4" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="2" x2="100%" y2="2" pathLength="100" />
      <line x1="0" y1="2" x2="100%" y2="2" pathLength="100"
        style="stroke:#336699; stroke-dasharray: 100;stroke-dashoffset: -50;" />
    </svg>
  </div>
</body>

</html>
