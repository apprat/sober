<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 24px;
      font-size: 18px;
      line-height: calc(100% + 12px);
    }

    .test {
      position: relative;
      display: flex;
    }

    .a {
      position: relative;
      background-color: red;
    }

    .b {
      position: relative;
      background-color: blue;
      margin: 0 -24px;
      opacity: 0.5;
    }

    .c {
      position: relative;
      background-color: yellow;
    }
  </style>
</head>

<body>
  <div class="test">
    <div class="a">aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa</div>
    <div class="b">bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb</div>

    <div class="c">ccccccccccccccccccccccccccccccccccccccc</div>
  </div>
</body>

</html>
