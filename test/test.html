<head>

  <title>Test Page</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
    }

    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-snap-stop: always;
      height: 200px;
      width: 500px;
      background: #eee;
    }

    .carousel-item {
      flex: 0 0 100%;
      scroll-snap-align: center;
    }

    .carousel-item:nth-child(odd) {
      background: #999;
    }
  </style>
</head>

<body>
  <div class="carousel">
    <div class="carousel-item">1</div>
    <div class="carousel-item">2</div>
    <div class="carousel-item" style="scroll-target-group: none;">3</div>
    <div class="carousel-item" style="scroll-target-group: none;">4</div>
  </div>

</body>

</html>
