<!DOCTYPE html>
<html lang="ZH-cn">

<head>
  <meta charset="UTF-8" />
  <title>Test</title>
  <script>
  </script>
</head>

<body>
  <template id="template">
    <s-checkbox onchange="this.value='on'" v-model.lazy="state.checked">
      {{state.checked}}</s-checkbox>
    <input type="checkbox" v-model="state.checked">

  </template>
  <main id="app"></main>
  <script src="../dist/sober.min.js"></script>
  <script src="../dist/theme.min.js"></script>
  <script src="../dist/design/fluent.min.js"></script>
  <script type="module">
    import { createApp, reactive } from 'https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.prod.js'
    const template = document.querySelector('template').innerHTML
    const app = createApp({
      template,
      setup() {
        const state = reactive({
          checked: false,
        })
        return { state }
      }
    })
    app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith('s-')
    app.mount('#app')
  </script>
</body>

</html>
